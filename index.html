<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#6c4cf1" />
<meta name="description" content="A colorful, responsive weekly calendar with per-day task lists." />
<title>Prism — Colorful Week Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗓️</text></svg>" />
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob blob--1"></span>
    <span class="blob blob--2"></span>
    <span class="blob blob--3"></span>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </span>
      <div class="brand__text">
        <h1>Prism</h1>
        <p id="rangeLabel" class="brand__range">&nbsp;</p>
      </div>
    </div>

    <nav class="nav" aria-label="Week navigation">
      <button class="nav__btn" id="prevWeek" type="button" aria-label="Previous week">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="nav__today" id="todayBtn" type="button">Today</button>
      <button class="nav__btn" id="nextWeek" type="button" aria-label="Next week">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </nav>
  </header>

  <main class="board" id="board" aria-label="Week calendar">
    <!-- day tiles injected here -->
  </main>

  <footer class="footer">
    <p><strong id="statTotal">0</strong> tasks this week · <strong id="statDone">0</strong> done</p>
    <button class="footer__clear" id="clearWeek" type="button">Clear week</button>
  </footer>

  <!-- Add-task sheet / dialog -->
  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet__grip" aria-hidden="true"></div>
    <header class="sheet__head">
      <div>
        <p class="sheet__eyebrow" id="sheetDate">&nbsp;</p>
        <h2 class="sheet__title" id="sheetTitle">New task</h2>
      </div>
      <button class="sheet__close" id="sheetClose" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <form class="sheet__form" id="taskForm" autocomplete="off">
      <input class="sheet__input" id="taskInput" type="text" placeholder="What needs doing?" maxlength="140" required />
      <button class="sheet__submit" type="submit">Add task</button>
    </form>
    <p class="sheet__hint">Press <kbd>Enter</kbd> to add another · <kbd>Esc</kbd> to close</p>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
